<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Alpha Radar{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body class="app-shell">
    <nav class="app-nav glass-panel">
        <div class="nav-left">
            <a class="brand" href="/">
                <span class="brand-mark"></span>
                <span class="brand-name">Alpha Radar</span>
            </a>
            <div class="nav-links">
                <a class="nav-item {% if request.url.path == '/' %}active{% endif %}" href="/">仪表盘</a>
                <a class="nav-item {% if request.url.path.startswith('/search') %}active{% endif %}" href="/search">新闻情报</a>
                <a class="nav-item {% if request.url.path == '/analyzer' %}active{% endif %}" href="/analyzer">关键词分析</a>
            </div>
        </div>
        <div class="nav-right">
            <span class="nav-badge">Beta</span>
        </div>
    </nav>
    <main class="app-main">
        {% block content %}{% endblock %}
    </main>
    <footer class="app-footer">
        <span>© 2025 Alpha Radar · 市场情报工作台</span>
        <span class="footer-links">
            <a href="/analyzer">工作流指南</a>
            <a href="https://www.alternative.me/crypto/fear-and-greed-index/" target="_blank" rel="noopener">情绪指数来源</a>
        </span>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
